{# Shared "publish a notice" form. Set publish_action before including. #}
<div class="admin-form-container">

    <h2>Publish a New Notice</h2>

    <form method="POST"
          action="{{ publish_action }}"
          enctype="multipart/form-data">

        <label for="page_type">Notice Type *</label>
        <select id="page_type" name="page_type" required>
            <option value="">Select notice type</option>
            <option value="event">Event</option>
            <option value="academic">Academic</option>
            <option value="announcement">Announcement</option>
        </select>

        <label for="title">Title *</label>
        <input type="text" id="title" name="title"
               placeholder="Enter notice title" required>

        <label for="category">Category *</label>
        <select id="category" name="category" required>
            <option value="">Select category</option>
        </select>

        <label for="description">Description *</label>
        <textarea id="description" name="description"
                  rows="5" placeholder="Enter notice details"
                  required></textarea>

        <!-- EVENT FIELDS -->
        <div id="eventFields" class="notice-fields" style="display: none;">

            <h3>Event Details</h3>

            <label for="event_date">Event Date</label>
            <input type="date" id="event_date" name="event_date">

            <label for="event_time">Event Time</label>
            <input type="text" id="event_time" name="event_time"
                   placeholder="Example: 10:00 AM">

            <label for="venue">Venue</label>
            <input type="text" id="venue" name="venue">

            <label for="organizer">Organizer</label>
            <input type="text" id="organizer" name="organizer"
                   value="{{ default_organizer or '' }}">

            <label for="eligibility">Eligibility</label>
            <input type="text" id="eligibility" name="eligibility">

            <label for="registration_link">External Registration Link (optional)</label>
            <input type="url" id="registration_link" name="registration_link"
                   placeholder="https://example.com">

            <label for="event_expires_on">Expiry Date</label>
            <input type="date" id="event_expires_on" name="expires_on">

        </div>

        <!-- ACADEMIC FIELDS -->
        <div id="academicFields" class="notice-fields" style="display: none;">

            <h3>Academic Notice Details</h3>

            <label for="notice_date">Notice Date</label>
            <input type="date" id="notice_date" name="notice_date">

            <label for="attachment">Upload PDF (Optional)</label>
            <input type="file" id="attachment" name="attachment" accept=".pdf">

            <label for="academic_expires_on">Expiry Date</label>
            <input type="date" id="academic_expires_on" name="expires_on">

        </div>

        <!-- ANNOUNCEMENT FIELDS -->
        <div id="announcementFields" class="notice-fields" style="display: none;">

            <h3>Announcement Details</h3>

            <label for="announcement_date">Announcement Date</label>
            <input type="date" id="announcement_date" name="announcement_date">

            <label for="announcement_expires_on">Expiry Date</label>
            <input type="date" id="announcement_expires_on" name="expires_on">

        </div>

        <button type="submit">Publish Notice</button>

    </form>

</div>

<script>
(function () {
    const typeSelect = document.getElementById("page_type");
    const categorySelect = document.getElementById("category");

    const sections = {
        event: document.getElementById("eventFields"),
        academic: document.getElementById("academicFields"),
        announcement: document.getElementById("announcementFields")
    };

    const categories = {
        event: ["Hackathon", "Workshop", "Webinar", "Competition"],
        academic: ["Exam", "Timetable", "Results", "Assignment"],
        announcement: ["Official", "Urgent", "General"]
    };

    function updateForm() {
        const type = typeSelect.value;

        // Hidden sections are also disabled, so only the chosen
        // section's expiry date is sent with the form.
        Object.keys(sections).forEach(function (key) {
            const show = key === type;
            sections[key].style.display = show ? "block" : "none";
            sections[key].querySelectorAll("input").forEach(function (input) {
                input.disabled = !show;
            });
        });

        categorySelect.innerHTML = '<option value="">Select category</option>';

        (categories[type] || []).forEach(function (category) {
            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            categorySelect.appendChild(option);
        });
    }

    typeSelect.addEventListener("change", updateForm);
    updateForm();
})();
</script>
